# bahodirbek.uz portfolio. Backend: 127.0.0.1:8100, frontend: 127.0.0.1:3100 (Docker).
# HTTPS keyinroq certbot bilan qo'shiladi (domen Cloudflare'da faol bo'lgach).
server {
    listen 80;
    listen [::]:80;
    server_name bahodirbek.uz www.bahodirbek.uz;

    client_max_body_size 12m;
    access_log /var/log/nginx/bahodirbek.access.log;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API va yuklangan rasmlar to'g'ridan-to'g'ri backend'ga
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_read_timeout 60s;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:8100;
        expires 7d;
    }

    # Qolgan hamma narsa: Next.js sayti
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_read_timeout 60s;
    }
}
